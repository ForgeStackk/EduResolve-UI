<div class="p-6 max-w-2xl space-y-6">

  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white hud-caps tracking-wider">Compose Message</h2>
    <a routerLink="../sent" class="text-sm text-red-400 hover:text-red-300 transition-colors">
      View Sent →
    </a>
  </div>

  <!-- Class + Subject selector -->
  <app-class-subject-dropdown
    (classChanged)="selectedClassId.set($event)"
    (subjectChanged)="selectedSubjectId.set($any($event))" />

  <!-- Recipient type -->
  <div>
    <label class="block text-xs hud-caps text-gray-500 mb-2">Send to</label>
    <div class="flex flex-wrap gap-2">
      @for (opt of recipientOptions; track opt.value) {
        <button
          type="button"
          (click)="recipientType.set(opt.value)"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-colors"
          [class]="recipientType() === opt.value
            ? 'bg-red-600 text-white'
            : 'bg-gray-800 text-gray-400 hover:bg-gray-700'">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <!-- Composer — only renders once a class is selected -->
  @if (selectedClassId()) {
    <div class="hud-card rounded-xl p-5">
      <app-message-composer
        [classId]="selectedClassId()"
        [subjectId]="selectedSubjectId() !== null ? selectedSubjectId()!.toString() : null"
        [recipientType]="recipientType()"
        [recipientLabel]="recipientLabel()"
        placeholder="Type your message…"
        submitLabel="Send Message"
        (messageSent)="onMessageSent($event)" />
    </div>
  } @else {
    <div class="hud-card rounded-xl p-6 flex items-center justify-center">
      <p class="text-gray-500 text-sm">Select a class above to compose a message.</p>
    </div>
  }

</div>
