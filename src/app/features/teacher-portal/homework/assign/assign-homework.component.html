<div class="p-6 max-w-2xl space-y-0">

  <!-- ── Page header ──────────────────────────────────────────────────────── -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl font-bold text-white hud-caps tracking-widest">Assign Homework</h2>
      <p class="text-xs text-gray-500 mt-0.5">Send homework to your class with any combination of text, voice, photos, and files</p>
    </div>
    <a routerLink="../sent" class="text-sm text-red-400 hover:text-red-300 transition-colors flex-shrink-0">
      View Sent →
    </a>
  </div>

  <!-- ── Top form card: Class / Subject ───────────────────────────────────── -->
  <div class="hud-card rounded-t-xl px-5 pt-5 pb-4 border-b border-gray-800">
    <app-class-subject-dropdown
      (classChanged)="selectedClassId.set($event)"
      (subjectChanged)="selectedSubjectId.set($any($event))" />
  </div>

  <!-- ── Composer card ────────────────────────────────────────────────────── -->
  @if (selectedClassId()) {
    <div class="hud-card rounded-b-xl px-5 pb-5 pt-5">
      <app-message-composer
        [classId]="selectedClassId()"
        [subjectId]="selectedSubjectId() !== null ? selectedSubjectId()!.toString() : null"
        recipientType="CLASS"
        [recipientLabel]="recipientLabel()"
        [showRecipientBadge]="false"
        [showDueDatePicker]="true"
        [showCameraCapture]="true"
        [fileAccept]="hwFileAccept"
        [maxFiles]="5"
        placeholder="Describe the homework: what to study, what to submit…"
        submitLabel="Assign Homework"
        (messageSent)="onHomeworkSent($event)" />
    </div>
  } @else {
    <div class="hud-card rounded-b-xl px-5 py-10 flex flex-col items-center justify-center gap-2">
      <span class="text-3xl">📝</span>
      <p class="text-gray-500 text-sm">Select a class above to start assigning homework.</p>
    </div>
  }

  <!-- ── Last sent banner ──────────────────────────────────────────────────── -->
  @if (lastSentCount() !== null) {
    <div class="mt-4 bg-green-900/30 border border-green-700 rounded-xl px-4 py-3 text-sm text-green-300">
      ✓ Homework assigned to {{ lastSentCount() }} student(s).
    </div>
  }

</div>
