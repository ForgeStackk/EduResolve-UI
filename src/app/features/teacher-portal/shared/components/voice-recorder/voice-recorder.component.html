<!-- ── Permission error ───────────────────────────────────────────────── -->
@if (permError()) {
  <div class="text-xs text-red-400 bg-red-900/30 border border-red-800 rounded-lg px-3 py-2 mb-2">
    {{ permError() }}
  </div>
}

@switch (state()) {

  <!-- ── IDLE ──────────────────────────────────────────────────────────── -->
  @case ('IDLE') {
    <button
      type="button"
      (click)="startRecording()"
      class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700
             hover:border-red-500 text-gray-300 hover:text-white rounded-xl text-sm font-medium
             transition-all">
      <span>🎤</span>
      <span>Record Voice Note</span>
    </button>
  }

  <!-- ── RECORDING ──────────────────────────────────────────────────────── -->
  @case ('RECORDING') {
    <div class="flex items-center gap-4 bg-gray-800 border border-red-700/60 rounded-xl px-4 py-3">

      <!-- Animated waveform bars -->
      <div class="flex items-center gap-0.5 h-6">
        @for (delay of waveDelays; track $index) {
          <span class="wave-bar" [style.animation-delay]="delay + 'ms'"></span>
        }
      </div>

      <!-- Timer — turns red with countdown in last minute -->
      <span
        class="font-mono text-sm tabular-nums"
        [class]="showCountdown() ? 'text-red-400' : 'text-white'">
        {{ formatTime(elapsed()) }}
        @if (showCountdown()) {
          <span class="text-xs ml-1">({{ formatTime(remaining()) }} left)</span>
        }
      </span>

      <!-- Stop button -->
      <button
        type="button"
        (click)="stopRecording()"
        class="ml-auto flex items-center gap-1.5 px-3 py-1.5 bg-red-600 hover:bg-red-500
               text-white rounded-lg text-xs font-bold transition-colors">
        <span>⏹</span>
        <span>Stop</span>
      </button>
    </div>
  }

  <!-- ── RECORDED ───────────────────────────────────────────────────────── -->
  @case ('RECORDED') {
    <div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
      <audio [src]="audioUrl()!" controls class="flex-1 min-w-0"></audio>
      <button
        type="button"
        (click)="deleteRecording()"
        title="Delete recording"
        class="flex-shrink-0 text-gray-500 hover:text-red-400 transition-colors text-lg leading-none">
        🗑
      </button>
    </div>
  }

}
