<div class="flex items-center w-full">
  @for (step of steps; track step; let i = $index; let last = $last) {
    <div class="flex items-center" [ngClass]="{'flex-1': !last}">
      <div class="flex flex-col items-center">
        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition-colors duration-300"
             [ngClass]="getStepClass(step)">
          {{ i + 1 }}
        </div>
        <span class="text-xs font-semibold mt-2" [ngClass]="getTextClass(step)">{{ step }}</span>
      </div>
      @if (!last) {
        <div class="flex-1 h-1 mx-2 transition-colors duration-300 rounded-full" [ngClass]="getLineClass(step)"></div>
      }
    </div>
  }
</div>
