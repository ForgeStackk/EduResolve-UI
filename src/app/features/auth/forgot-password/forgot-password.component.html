<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="header">
      <h1>Forgot Password</h1>
      <p>Enter your email address to receive a password reset token</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter your email"
          class="form-control"
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">{{ errorMessage() }}</div>
      }

      @if (successMessage()) {
        <div class="success-message">{{ successMessage() }}</div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="submit-btn"
      >
        @if (loading()) {
          <span class="spinner"></span>
          Processing...
        } @else {
          Send Reset Token
        }
      </button>
    </form>

    @if (resetToken()) {
      <div class="token-display">
        <p class="token-label">Your Reset Token:</p>
        <p class="token-value">{{ resetToken() }}</p>
        <p class="token-note">Use this token to reset your password</p>
        <button
          (click)="goToResetPassword()"
          class="reset-btn"
        >
          Reset Password
        </button>
      </div>
    }

    <div class="back-link">
      <a (click)="goToLogin()">Back to Login</a>
    </div>
  </div>
</div>
