<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Login to continue to EduResolve</p>
    </div>

    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <button
      (click)="login()"
      [disabled]="loading()"
      class="login-button"
    >
      @if (loading()) {
        <span class="loading-spinner"></span>
        Redirecting...
      } @else {
        Sign in with EduResolve
      }
    </button>

    <div class="login-footer">
      <p>Don't have an account?</p>
      <button (click)="goToSignup()" class="signup-link">
        Sign Up
      </button>
    </div>
  </div>
</div>
