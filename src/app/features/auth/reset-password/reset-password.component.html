<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="header">
      <h1>Reset Password</h1>
      <p>Enter your new password to reset your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="reset-password-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter your email"
          class="form-control"
          disabled
        />
      </div>

      <div class="form-group">
        <label for="token">Reset Token</label>
        <input
          type="text"
          id="token"
          [(ngModel)]="token"
          name="token"
          required
          placeholder="Enter reset token"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          placeholder="Enter new password"
          class="form-control"
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          placeholder="Confirm new password"
          class="form-control"
          minlength="6"
        />
      </div>

      @if (errorMessage()) {
        <div class="error-message">{{ errorMessage() }}</div>
      }

      @if (successMessage()) {
        <div class="success-message">{{ successMessage() }}</div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="submit-btn"
      >
        @if (loading()) {
          <span class="spinner"></span>
          Processing...
        } @else {
          Reset Password
        }
      </button>
    </form>

    <div class="back-link">
      <a (click)="goToLogin()">Back to Login</a>
    </div>
  </div>
</div>
