<div class="p-6 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">{{ 'bookmarks.title' | translate }}</h1>

  @if (loading()) {
    <p class="text-gray-500">{{ 'common.loading' | translate }}</p>
  } @else if (rows().length === 0) {
    <div class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center">
      <p class="text-gray-500">{{ 'bookmarks.empty' | translate }}</p>
    </div>
  } @else {
    <div class="space-y-3">
      @for (b of rows(); track b.id) {
        <div class="flex items-center justify-between rounded-xl border border-gray-200 bg-white p-4">
          <div>
            <span class="text-xs uppercase tracking-wide text-gray-400">{{ b.targetType }}</span>
            <p class="font-semibold">{{ b.label || ('#' + b.targetId) }}</p>
          </div>
          <button (click)="remove(b)" class="text-sm text-red-600 hover:text-red-700">Remove</button>
        </div>
      }
    </div>
  }
</div>
