<div class="space-y-6">

  <!-- Header -->
  <header class="flex items-center justify-between gap-4">
    <a (click)="back()" class="inline-flex items-center gap-2 hud-caps text-ink-500 hover:text-white transition-colors cursor-pointer">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
      EXIT
    </a>
    <h1 class="hud-display text-2xl sm:text-3xl text-white uppercase tracking-wider">
      {{ 'nav.notes' | translate }}
    </h1>
    <div class="w-10"></div>
  </header>

  <!-- Coming Soon -->
  <section class="hud-card flex flex-col items-center justify-center gap-6 py-16 relative overflow-hidden"
           style="opacity:0.85">
    <div class="hud-accent" style="background:#f59e0b"></div>

    <div class="absolute inset-0 bg-gradient-to-br from-amber-500/10 to-transparent pointer-events-none"></div>

    <div class="w-24 h-24 rounded-2xl flex items-center justify-center"
         style="background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3)">
      <span class="material-symbols-outlined"
            style="font-size:52px;color:#f59e0b;filter:drop-shadow(0 0 15px rgba(245,158,11,0.5))">auto_stories</span>
    </div>

    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 bg-amber-400/10 border border-amber-400/30 rounded-full px-4 py-1.5 mb-1">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span class="hud-caps text-amber-400 text-[11px]">COMING SOON</span>
      </div>
      <h2 class="hud-display text-3xl text-white">Generate Notes</h2>
      <p class="text-ink-500 text-sm max-w-xs leading-relaxed">
        AI-powered note generation is under development.<br>Check back soon to create smart notes from any chapter.
      </p>
    </div>
  </section>

</div>
