<div class="p-6 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">{{ 'doubt.title' | translate }}</h1>

  <div class="rounded-xl border border-gray-200 bg-white p-5">
    <textarea [(ngModel)]="query"
              rows="3"
              [placeholder]="'doubt.placeholder' | translate"
              class="w-full rounded-lg border border-gray-300 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
    <button (click)="ask()" [disabled]="!query.trim() || loading()"
            class="mt-3 rounded-full bg-orange-500 text-white px-5 py-2 text-sm font-semibold disabled:opacity-50">
      {{ loading() ? ('common.loading' | translate) : ('doubt.ask' | translate) }}
    </button>
  </div>

  @if (answer(); as a) {
    <div class="mt-5 rounded-xl border border-gray-200 bg-white p-5">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold">{{ 'doubt.answer' | translate }}</h2>
        <span class="text-xs px-2 py-0.5 rounded-full"
              [class.bg-green-100]="a.hitType !== 'ai'"
              [class.text-green-700]="a.hitType !== 'ai'"
              [class.bg-purple-100]="a.hitType === 'ai'"
              [class.text-purple-700]="a.hitType === 'ai'">
          {{ ('doubt.source.' + a.hitType) | translate }}
        </span>
      </div>
      <p class="text-gray-800 whitespace-pre-line">{{ a.answer }}</p>
    </div>
  }
</div>
