<div class="flex flex-col items-center justify-center p-4">
  @if (streak()?.gardenState === 'TREE') {
    <div class="w-32 h-32 mb-2 flex items-center justify-center" [ngClass]="animateGrowth() ? 'growth-pulse' : ''">
      <!-- Lottie Web Player for the Tree -->
      <lottie-player
        src="https://assets3.lottiefiles.com/packages/lf20_e3q0wtsq.json"
        background="transparent"
        speed="1"
        style="width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.4));"
        loop
        autoplay>
      </lottie-player>
    </div>
  } @else {
    <div class="text-6xl mb-2 garden-emoji" [ngClass]="animateGrowth() ? 'growth-pulse' : ''">
      {{ getGardenEmoji() }}
    </div>
  }
  <h3 (click)="triggerConfetti()" class="text-ink-900 font-bold text-lg mt-2 cursor-pointer hover:text-green-600 transition-colors" title="Click to test Confetti!">Streak Garden</h3>
  <p class="text-red-600 font-bold text-2xl">🔥 {{ streak()?.currentStreak || 0 }} Days</p>
  <p class="text-ink-500 text-xs mt-1 uppercase tracking-widest">{{ streak()?.gardenState || 'WILTED' }}</p>
</div>
