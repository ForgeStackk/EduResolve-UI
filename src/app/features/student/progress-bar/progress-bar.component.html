<div class="w-full">
  <div class="flex items-center justify-between gap-2 mb-2">
    <span class="text-label-md uppercase text-surface-mute font-semibold">{{ label() }}</span>
    <span class="text-label-md font-semibold text-surface-ink">{{ progress() }}%</span>
  </div>
  <div class="w-full bg-surface-low rounded-full h-2.5 overflow-hidden">
    <div class="h-full rounded-full bg-brand-700 transition-all duration-300" [style.width.%]="progress()"></div>
  </div>
</div>
