<div class="school-card font-sans">
  @if (currentQuestion(); as q) {
    <div class="mb-4">
      <span class="text-sm font-bold text-gray-400 tracking-wide uppercase">Question {{ currentIndex() + 1 }} of {{ questions().length }}</span>
      <h4 class="text-lg font-bold text-gray-900 mt-1">{{ q.text }}</h4>
    </div>

    <div class="space-y-3 mb-6">
      @for (opt of q.options; track opt.id) {
        <button (click)="selectOption(opt.id)"
                [class]="getOptionClass(opt.id)"
                class="w-full text-left px-5 py-4 rounded-lg border-2 transition-all duration-200 font-medium flex justify-between items-center outline-none">
          <span>{{ opt.text }}</span>
          @if (showFeedback() && opt.id === q.correctOptionId) {
            <span class="text-green-600 bg-green-100 px-2 py-0.5 rounded text-xs font-bold">✓ Correct</span>
          }
        </button>
      }
    </div>

    @if (showFeedback()) {
      <div [class]="isCorrect() ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800'" 
           class="p-4 rounded-lg mb-6 shadow-sm">
        <h5 class="font-bold mb-1">{{ isCorrect() ? 'Great Job!' : 'Incorrect' }}</h5>
        <p class="text-sm leading-relaxed">{{ q.explanation }}</p>
      </div>
    }

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
      @if (!showFeedback()) {
        <button (click)="submit()" [disabled]="!selectedOptionId()"
                class="btn-primary">
          Check Answer
        </button>
      } @else {
        <button (click)="next()" [disabled]="currentIndex() === questions().length - 1"
                class="btn-secondary">
          {{ currentIndex() === questions().length - 1 ? 'Quiz Completed' : 'Next Question' }}
        </button>
      }
    </div>
  }
</div>
