<nav class="bg-white border-b border-gray-200 px-4 md:px-6 py-3 flex items-center text-sm text-gray-500 overflow-x-auto whitespace-nowrap hidden md:flex">
  <a routerLink="/" class="hover:text-brand-primary transition-colors flex items-center gap-1 font-medium">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </a>
  @for (crumb of breadcrumbs; track crumb.path; let last = $last) {
    <span class="mx-2 text-gray-400">/</span>
    @if (last) {
      <span class="font-bold text-gray-900 capitalize">{{ crumb.label }}</span>
    } @else {
      <a [routerLink]="crumb.path" class="hover:text-brand-primary font-medium transition-colors capitalize">{{ crumb.label }}</a>
    }
  }
</nav>
