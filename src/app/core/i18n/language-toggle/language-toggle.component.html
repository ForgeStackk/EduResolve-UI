<div class="inline-flex items-center gap-1 rounded-full border border-gray-200 bg-white p-1 text-sm shadow-sm">
  <button
    type="button"
    (click)="lang.set('en')"
    [class.bg-orange-500]="lang.current() === 'en'"
    [class.text-white]="lang.current() === 'en'"
    [class.text-gray-600]="lang.current() !== 'en'"
    class="px-3 py-1 rounded-full font-semibold transition-colors">
    EN
  </button>
  <button
    type="button"
    (click)="lang.set('hi')"
    [class.bg-orange-500]="lang.current() === 'hi'"
    [class.text-white]="lang.current() === 'hi'"
    [class.text-gray-600]="lang.current() !== 'hi'"
    class="px-3 py-1 rounded-full font-semibold transition-colors">
    हिं
  </button>
</div>
