<div class="inline-flex items-center gap-1 rounded-full border border-white/10 bg-white/5 p-1 text-xs">
  <button
    type="button"
    (click)="lang.set('en')"
    [class.bg-red-600]="lang.current() === 'en'"
    [class.text-white]="lang.current() === 'en'"
    [class.text-white/60]="lang.current() !== 'en'"
    class="px-2.5 py-1 rounded-full font-bold tracking-wider transition-colors">
    EN
  </button>
  <button
    type="button"
    (click)="lang.set('hi')"
    [class.bg-red-600]="lang.current() === 'hi'"
    [class.text-white]="lang.current() === 'hi'"
    [class.text-white/60]="lang.current() !== 'hi'"
    class="px-2.5 py-1 rounded-full font-bold tracking-wider transition-colors">
    हिं
  </button>
</div>
