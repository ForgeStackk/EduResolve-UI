<app-inbox-toast />

@if (isHud()) {
  <!-- Main shell for /student and /learn routes -->
  <app-hud-shell></app-hud-shell>
} @else {
  <!-- Classic shell for /teacher, /admin, /parent -->
  <div class="h-screen flex flex-col font-sans overflow-hidden bg-gray-100">
    <app-top-nav></app-top-nav>
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
      <app-sidebar></app-sidebar>

      <div class="flex-1 flex flex-col overflow-hidden">
        <app-breadcrumb></app-breadcrumb>
        <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  </div>
}
